name: Jegyzet és bizonyítások ellenőrzése

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek telepítése
        run: |
          npm ci
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install --yes coq

      - name: Rocq/Coq-bizonyítások ellenőrzése
        run: npm run proofs:check

      - name: Dokumentáció ellenőrzése
        run: npm run docs:html
